<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ — Выборы старосты</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <main class="container">
    <header class="header">
      <div class="badge">Админ-панель</div>
      <h1>Управление выборами</h1>
    </header>

    <section id="loginView" class="card">
      <h2>Вход</h2>
      <div class="row-flex">
        <input type="password" id="passwordInput" placeholder="Пароль администратора">
        <button class="btn" id="loginBtn">Войти</button>
      </div>
    </section>

    <section id="panelView" class="admin-grid" hidden>

      <div class="card">
        <h2>1. Этапы голосования</h2>
        <div class="row-flex" style="flex-direction:column;gap:10px;">
          <button class="btn btn-ghost" id="stage0Btn">Закрыть всё</button>
          <button class="btn" id="openStage1Btn">Открыть Этап 1</button>
          <button class="btn btn-ghost" id="closeStage1Btn">Завершить Этап 1 (посчитать 5%)</button>
          <button class="btn" id="openStage2Btn">Открыть Этап 2</button>
        </div>
        <div id="stageInfoBox" style="margin-top:14px;font-size:13px;color:var(--text-dim);"></div>
      </div>

      <div class="card">
        <h2>2. Текущая статистика</h2>
        <div id="statsBox">Загрузка…</div>
        <div class="divider"></div>
        <button class="btn btn-ghost" id="refreshBtn" style="width:100%;">Обновить</button>
      </div>

      <div class="card">
        <h2>3. ID для голосующего вручную</h2>
        <button class="btn btn-ghost" id="genIdBtn">Сгенерировать ID</button>
        <div id="idBox" class="id-box" style="margin-top:12px; display:none;"></div>
      </div>

      <div class="card">
        <h2>4. Добавить голос вручную</h2>
        <div class="row-flex" style="margin-bottom:10px;">
          <select id="candidateSelect"></select>
        </div>
        <div class="row-flex">
          <input type="text" id="voterIdInput" placeholder="ID избирателя">
          <button class="btn" id="addVoteBtn">Добавить</button>
        </div>
      </div>

      <div class="card">
        <h2>5. Коды кандидатов</h2>
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">
          Генерирует коды один раз. Скопируй их сразу — потом можно увидеть только в таблице.
        </p>
        <button class="btn" id="genAllCodesBtn" style="width:100%;">Сгенерировать коды всем кандидатам</button>
        <div id="codesList" style="margin-top:14px;"></div>
      </div>

      <div class="card">
        <h2>6. Итоги</h2>
        <div class="row-flex">
          <button class="btn" id="finishBtn" style="flex:1;">Подвести итоги</button>
          <button class="btn btn-danger" id="resetBtn">Сбросить</button>
        </div>
      </div>

      <div id="adminMsg" class="msg" hidden></div>
    </section>

    <footer class="footer">
      <a href="index.html" class="link-dim">← На основной сайт</a>
    </footer>
  </main>

  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
