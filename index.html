<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выборы старосты</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <main class="container">
    <header class="header">
      <div class="badge">Голосование</div>
      <h1>Выборы старосты</h1>
      <p class="subtitle">Кто вы?</p>
    </header>

    <div class="role-buttons">
      <button class="role-btn" id="voterBtn">
        <div class="role-title">Голосующий</div>
        <div class="role-desc">Войти и проголосовать</div>
      </button>
      <button class="role-btn" id="candidateBtn">
        <div class="role-title">Кандидат</div>
        <div class="role-desc">Нужен специальный код</div>
      </button>
    </div>

    <footer class="footer">
      <a href="results.html" class="link-dim">Итоги голосования</a>
      <a href="admin.html" class="admin-link">admin</a>
    </footer>
  </main>

  <script src="api.js"></script>
  <script>
    // Сброс предыдущей сессии при входе в корень
    // (если хочешь — закомментируй, чтобы не сбрасывать)
    Session.clear();

    document.getElementById('voterBtn').onclick = () => {
      Session.role = 'voter';
      location.href = 'stage.html';
    };

    document.getElementById('candidateBtn').onclick = () => {
      location.href = 'code.html';
    };
  </script>
</body>
</html>
